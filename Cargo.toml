[package]
name = "ppl"
version = "4.0.5"
edition = "2021"
description = "Command-line address book"
license = "MIT"
repository = "https://github.com/henrycatalinismith/ppl"

[[bin]]
name = "ppl"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
git2 = { version = "0.21", default-features = false }
mail-parser = "1"
regex = "1"
rustyline = { version = "19", default-features = false }
sha1 = "0.11"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
